services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:sts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - monitoring-state:/data
    ports:
      - 9443:9443

volumes:
  monitoring-state:
    name: monitoring-state

networks:
  default:
    name: portainer_network
