name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent
# Automatically run the setup steps when they are changed to allow for easy validation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      # Install gh-aw extension for advanced GitHub CLI features
      - name: Install gh-aw extension
        run: |
          curl -fsSL https://raw.githubusercontent.com/githubnext/gh-aw/refs/heads/main/install-gh-aw.sh | bash

      - name: Install age
        uses: alessiodionisi/setup-age-action@v1.4.0
        with:
          version: ^1.3.1

      - name: Install SOPS
        uses: nhedger/setup-sops@v2

      - name: Prepare SOPS key file for docker compose
        shell: bash
        run: |
          if [[ -n "${SOPS_AGE_KEY:-}" ]]; then
            umask 077
            printf '%s' "${SOPS_AGE_KEY}" > sops_age_key.txt
            echo "✅ Created sops_age_key.txt from SOPS_AGE_KEY environment variable"
          elif [[ -f sops_age_key.txt ]]; then
            chmod 600 sops_age_key.txt
            echo "✅ Using existing sops_age_key.txt from repository workspace"
          else
            echo "❌ Missing SOPS key material. Configure Agent secret SOPS_AGE_KEY or provide sops_age_key.txt." >&2
            exit 1
          fi

      # Verify installations
      - name: Verify tool installations
        run: |
          echo "=== Verifying installations ==="
          docker --version
          gh aw version
          age --version
          sops --version
          echo "✅ All tools installed successfully"