x-poll-config: &poll-config
 POLL_CONFIG: |
   - url: ${REPO_URL:-file:///local_repo}  # Repository to poll: REPO_URL if set, otherwise local mount
     reference: ${REPO_REF:-main}  # Optional: specify the branch or tag to poll, defaults to 'main'
     interval: ${POLL_INTERVAL:-60}  # Optional: specify the interval in seconds to poll the repository, defaults to 180 seconds (3 minutes)
     run_once: ${RUN_ONCE:-false}  # Optional: when true, stops polling after initial run (useful for local testing)
     target: ""  # Optional: use to target a specific deployment config file, e.g., "test" -> .doco-cd.test.yaml

services:
  app:
    container_name: home-server
    image: ghcr.io/kimdre/doco-cd:latest
    restart: unless-stopped
    ports:
      # - "8888:8888" # Webhook endpoint
      - "9122:9122" # Prometheus metrics
    # For all available environment variables and explanations, see https://github.com/kimdre/doco-cd/wiki/App-Settings
    environment:
      TZ: Europe/Amsterdam
      GIT_ACCESS_TOKEN: ${GITHUB_READ_TOKEN:-}
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key # docker secrets are always mounted to /run/secrets/ if no target is specified
      DOCKER_SWARM_FEATURES: false
      LOG_LEVEL: debug
      PASS_ENV: true
      NFS_SERVER_ADDR: ${NFS_SERVER_ADDR:-192.168.1.111}
      <<: *poll-config  # Uncomment this line to use the poll configuration from above (the `x-poll-config` section).
    secrets:
      - sops_age_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LOCAL_VOLUME_LOCATION:?LOCAL_VOLUME_LOCATION must be set}:/data
      - ${REPO_DIR:-.}:/local_repo:ro
    healthcheck:
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
secrets:
  sops_age_key:
    file: sops_age_key.txt
