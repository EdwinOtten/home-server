services:

  init-folders:
    image: alpine
    container_name: init-folders
    environment:
      - PUID=${PUID:?error}
      - PGID=${PGID:?error}
    volumes:
      - media-server-remote-root:/mnt/media-server-remote-root
      - media-server-local-root:/mnt/media-server-local-root
      - configarr-cache:/mnt/configarr-cache
    # This command creates all subdirectories at once and sets correct ownership
    command: >
      sh -c "mkdir -p /mnt/media-server-remote-root/media/movies 
      /mnt/media-server-remote-root/media/series 
      /mnt/media-server-remote-root/media/downloads/usenet/complete 
      /mnt/media-server-remote-root/media/downloads/torrent/complete 
      /mnt/media-server-local-root/downloads/usenet/incomplete 
      /mnt/media-server-local-root/downloads/torrent/incomplete 
      /mnt/media-server-local-root/services/sonarr 
      /mnt/media-server-local-root/services/radarr 
      /mnt/media-server-local-root/services/configarr 
      /mnt/media-server-local-root/services/prowlarr 
      /mnt/media-server-local-root/services/bazarr/config/config 
      /mnt/media-server-local-root/services/seerr 
      /mnt/media-server-local-root/services/sabnzbd 
      /mnt/media-server-local-root/services/jellyfin/data 
      && chown -R ${PUID}:${PGID} /mnt/media-server-remote-root /mnt/media-server-local-root /mnt/configarr-cache &&
      chmod -R u+rwX,go-wx /mnt/media-server-remote-root /mnt/media-server-local-root /mnt/configarr-cache"
    restart: on-failure
    healthcheck:
      disable: true

  # qBitorrent is used to download torrents
#  qbittorrent:
#    image: lscr.io/linuxserver/qbittorrent:4.6.3
