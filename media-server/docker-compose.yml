services:

  init-folders:
    # Alpine 3.22
    image: alpine:3.22
    container_name: init-folders
    environment:
      - PUID=${PUID:?error}
      - PGID=${PGID:?error}
    volumes:
      - media-server-media:/mnt/media-server-media
      - media-server-state:/mnt/media-server-state
    # This command creates all subdirectories at once and sets correct ownership
    command: >
      sh -c "mkdir -p /mnt/media-server-media/media/movies
      /mnt/media-server-media/media/series
      /mnt/media-server-media/media/downloads/usenet/complete
      /mnt/media-server-media/media/downloads/torrent/complete
      /mnt/media-server-state/downloads/usenet/incomplete
      /mnt/media-server-state/downloads/torrent/incomplete
      /mnt/media-server-state/services/sonarr
      /mnt/media-server-state/services/radarr
      /mnt/media-server-state/services/configarr
      /mnt/media-server-state/services/prowlarr
      /mnt/media-server-state/services/bazarr/config/config
      /mnt/media-server-state/services/seerr
      /mnt/media-server-state/services/sabnzbd
      /mnt/media-server-state/services/jellyfin
      && chown -R ${PUID}:${PGID} /mnt/media-server-media /mnt/media-server-state &&
      chmod -R u+rwX,go-wx /mnt/media-server-media /mnt/media-server-state
      && exec tail -f /dev/null"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -d /mnt/media-server-media/media && test -d /mnt/media-server-state/services"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # qBitorrent is used to download torrents
#  qbittorrent:
#    image: lscr.io/linuxserver/qbittorrent:4.6.3
#    container_name: qbittorrent
#    environment:
